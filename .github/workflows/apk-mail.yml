# Сборка приложения Android «Почта ФД» (APK без подписи).
# Подпись делается отдельно ключом владельца (ключ не хранится в репозитории).
name: APK Почта
on:
  push:
    paths: ['android-mail/**', '.github/workflows/apk-mail.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk-mail-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Сборка
        working-directory: android-mail
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee ../build.log
      - name: Выложить результат
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-mail-build-$(echo "$GITHUB_REF_NAME" | tr '/' '-')"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease --target "$GITHUB_SHA" \
            --title "Служебная сборка «Почта ФД» ($GITHUB_REF_NAME)" --notes "Без подписи, для проверки. Устанавливать — файл из выпуска «Приложение Android»."
          F=android-mail/app/build/outputs/apk/release/app-release-unsigned.apk
          echo "$GITHUB_SHA ${{ job.status }} run=$GITHUB_RUN_NUMBER" > status.txt
          if [ -f "$F" ]; then cp "$F" unsigned.apk; gh release upload "$TAG" unsigned.apk --clobber; else echo "$GITHUB_SHA failure run=$GITHUB_RUN_NUMBER" > status.txt; fi
          touch build.log; gh release upload "$TAG" build.log status.txt --clobber
      - name: Включить KVM для эмулятора
        if: success()
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Проверка на эмуляторе Android
        if: success()
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash android-mail/emulator-test.sh
      - name: Выложить снимки экрана
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-mail-build-$(echo "$GITHUB_REF_NAME" | tr '/' '-')"
          for f in shot1.png shot2.png shot3.png shot4.png shot5.png pid.txt errors.txt logcat.txt; do if [ -s "$f" ]; then gh release upload "$TAG" "$f" --clobber || true; fi; done
